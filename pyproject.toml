[project]
name = "fastapi-sandbox"
version = "0.1.0"
description = "FastAPI sandbox for experimentation"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "orjson>=3.11.8",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "ruff>=0.15.11",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
